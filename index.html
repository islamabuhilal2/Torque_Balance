<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3f2537">
  <title>Arabic Torque Balance Lab</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#3f2537;overflow:hidden;touch-action:none}
    #unity-container{position:fixed;inset:0;overflow:hidden;width:100%;height:100%;height:100dvh}
    #unity-canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
    #loading{position:absolute;inset:0;display:grid;place-items:center;color:#ffefd8;
      font:600 1.1rem system-ui,Arial;text-align:center;background:linear-gradient(145deg,#4a293d,#7e4750)}
    #loading span{padding:24px;border:1px solid #ba866e;border-radius:18px}
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><span>جاري تجهيز مختبر العزم والاتزان…</span></div>
  </div>
  <script src="Build/New folder.loader.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const config = {
      dataUrl: 'Build/New folder.data.unityweb',
      frameworkUrl: 'Build/New folder.framework.js.unityweb',
      codeUrl: 'Build/New folder.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Interactive Learning Lab",
      productName: "Arabic Torque Balance Lab",
      productVersion: "1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true
    };
    createUnityInstance(canvas, config, (progress) => {
      loading.firstElementChild.textContent = 'جاري التحميل ' + Math.round(progress * 100) + '%';
    }).then(() => { loading.remove(); canvas.focus(); })
      .catch((err) => { loading.firstElementChild.textContent = 'خطأ في التشغيل: ' + err; });
  </script>
</body>
</html>
